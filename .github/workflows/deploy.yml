# Publishes the site to GitHub Pages on every push to main.
#
# There is nothing to build — the repository is the site — so this just
# uploads the files and hands them to Pages. `enablement: true` switches
# Pages on the first time it runs, so there is no setting to click.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Turn Pages on if it isn't already
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Package the files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
