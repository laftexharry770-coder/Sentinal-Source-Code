<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580" width="760" height="580"
     role="img" aria-label="HOMCOM COMPUTERS — computers, phones, accessories and repairs. Rasumal House, ground floor, first shop, Tom Mboya Street, Nairobi. Call 0724 359 797 or 0738 715 271.">
  <title>HOMCOM COMPUTERS — shopfront lockup</title>
  <!-- The full lockup: name, what the shop sells, where it is, and how to reach it.
       Made for the shopfront sign, flyers, receipts, WhatsApp profile and posters.
       For the website header and email signatures use logo-horizontal.svg instead. -->
  <defs>
    <linearGradient id="hcTileF" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1450b4"/>
    </linearGradient>
    <style>
      .f     { font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .name  { font-size: 52px;   font-weight: 800; letter-spacing: .5px;  fill: #0f1720; }
      .sub   { font-size: 22px;   font-weight: 600; letter-spacing: 10.5px; fill: #1f6feb; }
      .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 2.4px; fill: #8a92a0; }
      .chip  { font-size: 14.5px; font-weight: 600; fill: #1450b4; }
      .line  { font-size: 15.5px; font-weight: 500; fill: #263140; }
      .lineb { font-size: 15.5px; font-weight: 700; fill: #0f1720; }
      .note  { font-size: 13px;   font-weight: 500; fill: #6b7482; }
      .foot  { font-size: 13px;   font-weight: 600; fill: #4a5462; letter-spacing: .2px; }
      .ico   { fill: #1f6feb; }
    </style>
  </defs>

  <rect width="760" height="580" rx="24" fill="#ffffff"/>

  <!-- ── name plate ─────────────────────────────────────────────────────── -->
  <g transform="translate(48 44) scale(1.5625)">
    <rect width="64" height="64" rx="14" fill="url(#hcTileF)"/>
    <path d="M0 14A14 14 0 0 1 14 0h24L6 32H0Z" fill="#fff" opacity=".08"/>
    <g fill="#fff">
      <rect x="16.5" y="14" width="11" height="36" rx="4"/>
      <rect x="36.5" y="14" width="11" height="36" rx="4"/>
      <rect x="25" y="27.5" width="14" height="9" rx="3"/>
    </g>
    <rect x="19.5" y="17.6" width="5" height="1.8" rx=".9" fill="#1450b4" opacity=".55"/>
    <circle cx="42" cy="46.4" r="1.3" fill="#1450b4" opacity=".55"/>
  </g>

  <g class="f">
    <text x="188" y="102" class="name">HOMCOM</text>
    <text x="190" y="136" class="sub">COMPUTERS</text>
  </g>

  <line x1="48" y1="182" x2="712" y2="182" stroke="#e4e8ef" stroke-width="1.5"/>

  <!-- ── what we deal in ────────────────────────────────────────────────── -->
  <g class="f">
    <text x="48" y="216" class="eyebrow">WHAT WE DEAL IN</text>

    <g>
      <rect x="48"  y="234" width="104" height="34" rx="17" fill="#eef4ff"/>
      <text x="100" y="256" class="chip" text-anchor="middle">Computers</text>

      <rect x="162" y="234" width="82"  height="34" rx="17" fill="#eef4ff"/>
      <text x="203" y="256" class="chip" text-anchor="middle">Phones</text>

      <rect x="254" y="234" width="116" height="34" rx="17" fill="#eef4ff"/>
      <text x="312" y="256" class="chip" text-anchor="middle">Accessories</text>

      <rect x="380" y="234" width="90"  height="34" rx="17" fill="#eef4ff"/>
      <text x="425" y="256" class="chip" text-anchor="middle">Repairs</text>
    </g>
  </g>

  <line x1="48" y1="302" x2="712" y2="302" stroke="#e4e8ef" stroke-width="1.5"/>

  <!-- ── where we are ───────────────────────────────────────────────────── -->
  <g class="f">
    <text x="48" y="338" class="eyebrow">WHERE TO FIND US</text>

    <g transform="translate(48 354) scale(.75)" class="ico">
      <path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/>
    </g>
    <text x="76" y="368" class="lineb">Rasumal House, ground floor, first shop</text>
    <text x="76" y="390" class="line">Tom Mboya Street, Nairobi, Kenya</text>
    <text x="76" y="412" class="note">Opposite Imenti House, near Odeon.</text>
  </g>

  <!-- ── how to reach us ────────────────────────────────────────────────── -->
  <g class="f">
    <text x="418" y="338" class="eyebrow">HOW TO REACH US</text>

    <g transform="translate(418 354) scale(.75)" class="ico">
      <path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.2.4 2.4.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/>
    </g>
    <text x="446" y="368" class="lineb">0724 359 797 · 0738 715 271</text>

    <g transform="translate(418 382) scale(.75)" fill="#25D366">
      <path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.1-1.3A10 10 0 1 0 12 2zm0 18.2c-1.6 0-3.1-.4-4.4-1.2l-.3-.2-3 .8.8-3-.2-.3A8.2 8.2 0 1 1 12 20.2z"/>
      <path d="M17.5 14.4c-.3-.2-1.7-.9-2-1-.3-.1-.5-.2-.7.1s-.7 1-.9 1.2c-.2.2-.3.2-.6.1a8.2 8.2 0 0 1-4-3.5c-.3-.5.3-.5.8-1.5.1-.2 0-.4 0-.5l-1-2.3c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.2.2 2.2 3.4 5.4 4.7 2 .8 2.7.9 3.7.8.6-.1 1.7-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.2-.3-.2-.6-.4z"/>
    </g>
    <text x="446" y="396" class="line">WhatsApp 0724 359 797</text>

    <g transform="translate(418 410) scale(.75)" class="ico">
      <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/>
    </g>
    <text x="446" y="424" class="line">homcomcomputers@gmail.com</text>

    <g transform="translate(418 438) scale(.75)" class="ico">
      <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm6.9 6h-2.9a15.7 15.7 0 0 0-1.4-3.6A8 8 0 0 1 18.9 8zM12 4.2c.8 1.2 1.5 2.4 1.9 3.8h-3.8c.4-1.4 1.1-2.6 1.9-3.8zM4.3 14a8 8 0 0 1 0-4h3.4a16.6 16.6 0 0 0 0 4H4.3zm.8 2h2.9c.3 1.3.8 2.5 1.4 3.6A8 8 0 0 1 5.1 16zm2.9-8H5.1a8 8 0 0 1 4.3-3.6A15.7 15.7 0 0 0 8 8zm4 11.8c-.8-1.2-1.5-2.4-1.9-3.8h3.8c-.4 1.4-1.1 2.6-1.9 3.8zm2.3-5.8H9.7a14.7 14.7 0 0 1 0-4h4.6a14.7 14.7 0 0 1 0 4zm.3 5.6c.6-1.1 1.1-2.3 1.4-3.6h2.9a8 8 0 0 1-4.3 3.6zm1.7-5.6a16.6 16.6 0 0 0 0-4h3.4a8 8 0 0 1 0 4h-3.4z"/>
    </g>
    <text x="446" y="452" class="line">homcomtech.com</text>

    <g transform="translate(418 466) scale(.75)" class="ico">
      <path d="m21.7 6.3-2.6 2.6a1 1 0 0 1-1.4 0l-2.6-2.6a1 1 0 0 1 0-1.4l2.6-2.6a5 5 0 0 0-6.3 6.2L3.7 16.2a2.5 2.5 0 1 0 3.5 3.5l7.7-7.7a5 5 0 0 0 6.2-6.3z"/>
    </g>
    <text x="446" y="480" class="line">Repair desk 0106 998 733</text>
  </g>

  <!-- ── hours ──────────────────────────────────────────────────────────── -->
  <path d="M0 516h760v40a24 24 0 0 1-24 24H24A24 24 0 0 1 0 556v-40z" fill="#f4f7fb"/>
  <line x1="0" y1="516" x2="760" y2="516" stroke="#e4e8ef" stroke-width="1.5"/>
  <text x="380" y="546" class="f foot" text-anchor="middle">Open 7 days a week · calls, texts, WhatsApp and email answered 8am – 8pm</text>

  <!-- Drawn last so the card edge stays visible over the footer band, whatever
       colour this sits on. -->
  <rect x=".75" y=".75" width="758.5" height="578.5" rx="23.25" fill="none" stroke="#e4e8ef" stroke-width="1.5"/>
</svg>
