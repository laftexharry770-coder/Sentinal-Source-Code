<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 366 116" width="366" height="116"
     role="img" aria-label="HOMCOM COMPUTERS — computers, phones, accessories and repairs">
  <title>HOMCOM COMPUTERS</title>
  <!-- Horizontal lockup: for the website header, letterheads, invoices and email
       signatures. On a dark background use logo-horizontal-dark.svg instead; the
       ink here is near-black and would disappear. -->
  <defs>
    <linearGradient id="hcTileH" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1450b4"/>
    </linearGradient>
    <style>
      .hc-font { font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .hc-name { font-size: 37px; font-weight: 800; letter-spacing: .4px; fill: #0f1720; }
      .hc-sub  { font-size: 17px; font-weight: 600; letter-spacing: 6px;  fill: #1f6feb; }
      .hc-tag  { font-size: 11.5px; font-weight: 500; letter-spacing: .2px; fill: #5a6472; }
    </style>
  </defs>

  <g transform="translate(6 18) scale(1.25)">
    <rect width="64" height="64" rx="14" fill="url(#hcTileH)"/>
    <path d="M0 14A14 14 0 0 1 14 0h24L6 32H0Z" fill="#fff" opacity=".08"/>
    <g fill="#fff">
      <rect x="16.5" y="14" width="11" height="36" rx="4"/>
      <rect x="36.5" y="14" width="11" height="36" rx="4"/>
      <rect x="25" y="27.5" width="14" height="9" rx="3"/>
    </g>
    <rect x="19.5" y="17.6" width="5" height="1.8" rx=".9" fill="#1450b4" opacity=".55"/>
    <circle cx="42" cy="46.4" r="1.3" fill="#1450b4" opacity=".55"/>
  </g>

  <g class="hc-font">
    <text x="106" y="56" class="hc-name">HOMCOM</text>
    <text x="108" y="80" class="hc-sub">COMPUTERS</text>
    <text x="108" y="101" class="hc-tag">Computers · Phones · Accessories · Repairs</text>
  </g>
</svg>
