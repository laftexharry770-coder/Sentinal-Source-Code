<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="HOMCOM COMPUTERS">
  <title>HOMCOM COMPUTERS</title>
  <!-- The mark: an H built from two device bodies. The left bar carries a phone's
       speaker slot, the right bar a monitor's power light. Both details fade out
       harmlessly at favicon size, leaving a clean H. -->
  <defs>
    <linearGradient id="hcTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1450b4"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#hcTile)"/>

  <!-- screen glare -->
  <path d="M0 14A14 14 0 0 1 14 0h24L6 32H0Z" fill="#fff" opacity=".08"/>

  <g fill="#fff">
    <rect x="16.5" y="14" width="11" height="36" rx="4"/>
    <rect x="36.5" y="14" width="11" height="36" rx="4"/>
    <rect x="25" y="27.5" width="14" height="9" rx="3"/>
  </g>

  <!-- phone speaker slot (left bar) and monitor power light (right bar) -->
  <rect x="19.5" y="17.6" width="5" height="1.8" rx=".9" fill="#1450b4" opacity=".55"/>
  <circle cx="42" cy="46.4" r="1.3" fill="#1450b4" opacity=".55"/>
</svg>
