<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>HOMCOM COMPUTERS</title>
  <!-- Safari pinned-tab icon. Safari requires a flat silhouette in solid black on
       a transparent ground and recolours it itself, so there is no tile here and
       no gradient - just the H, sized to fill the frame. -->
  <g fill="#000000">
    <rect x="8"  y="6" width="14" height="52" rx="5"/>
    <rect x="42" y="6" width="14" height="52" rx="5"/>
    <rect x="19" y="25" width="26" height="14" rx="4"/>
  </g>
</svg>
