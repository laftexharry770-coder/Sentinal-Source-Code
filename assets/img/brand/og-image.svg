<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"
     role="img" aria-label="HOMCOM COMPUTERS — computers, phones, accessories and repairs. Tom Mboya Street, Nairobi.">
  <title>HOMCOM COMPUTERS</title>
  <!-- The picture that appears when someone shares homcomtech.com in WhatsApp,
       Facebook or iMessage. 1200x630 is the size those apps crop to. Kept simple
       because it is usually seen small, inside a chat bubble. -->
  <defs>
    <linearGradient id="hcOg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7bf6"/>
      <stop offset="1" stop-color="#12409a"/>
    </linearGradient>
    <style>
      .f    { font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .nm   { font-size: 96px; font-weight: 800; letter-spacing: 1px;  fill: #ffffff; }
      .sb   { font-size: 40px; font-weight: 600; letter-spacing: 19px; fill: #bcd6ff; }
      .tg   { font-size: 33px; font-weight: 600; letter-spacing: .4px; fill: #ffffff; }
      .loc  { font-size: 28px; font-weight: 500; letter-spacing: .3px; fill: #cfe0ff; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#hcOg)"/>
  <path d="M0 0h620L280 630H0Z" fill="#fff" opacity=".05"/>

  <!-- the H, in white on the blue field -->
  <g transform="translate(140 175) scale(4.4)" >
    <g fill="#fff">
      <rect x="16.5" y="14" width="11" height="36" rx="4"/>
      <rect x="36.5" y="14" width="11" height="36" rx="4"/>
      <rect x="25" y="27.5" width="14" height="9" rx="3"/>
    </g>
    <rect x="19.5" y="17.6" width="5" height="1.8" rx=".9" fill="#12409a" opacity=".45"/>
    <circle cx="42" cy="46.4" r="1.3" fill="#12409a" opacity=".45"/>
  </g>

  <g class="f">
    <text x="392" y="288" class="nm">HOMCOM</text>
    <text x="396" y="346" class="sb">COMPUTERS</text>
    <text x="396" y="426" class="tg">Computers · Phones · Accessories · Repairs</text>
    <text x="396" y="476" class="loc">Tom Mboya Street, Nairobi · 0724 359 797</text>
  </g>
</svg>
