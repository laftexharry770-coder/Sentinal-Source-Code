<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="HOMCOM COMPUTERS">
  <title>HOMCOM COMPUTERS — profile picture</title>
  <!-- Profile picture for WhatsApp, Facebook and Instagram. Full-bleed on purpose:
       those apps crop to a circle, so the rounded-square tile and any transparency
       would be cut away. The H is sized to sit inside the circle with room to spare. -->
  <defs>
    <linearGradient id="hcProf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1450b4"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#hcProf)"/>
  <path d="M0 0h256L96 256H0Z" fill="#fff" opacity=".07"/>

  <!-- the H, scaled up from the 64-unit mark and centred -->
  <g transform="translate(256 256) scale(5.6) translate(-32 -32)">
    <g fill="#fff">
      <rect x="16.5" y="14" width="11" height="36" rx="4"/>
      <rect x="36.5" y="14" width="11" height="36" rx="4"/>
      <rect x="25" y="27.5" width="14" height="9" rx="3"/>
    </g>
    <rect x="19.5" y="17.6" width="5" height="1.8" rx=".9" fill="#1450b4" opacity=".5"/>
    <circle cx="42" cy="46.4" r="1.3" fill="#1450b4" opacity=".5"/>
  </g>
</svg>
